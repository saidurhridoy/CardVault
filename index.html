<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CardVault — Your Business Contact Vault</title>
  <meta name="description" content="CardVault keeps every business contact in one searchable vault. Photograph a visiting card and its details are filed for you automatically — name, phone, email, company. Free and open source." />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="color-scheme" content="light dark" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CardVault" />

  <meta property="og:title" content="CardVault — Business card scanner &amp; contact manager" />
  <meta property="og:description" content="Scan business cards with your camera, auto-extract details with OCR, and search contacts by name, company, or designation." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="icons/icon-512.png" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" class="app-root">
    <div class="boot-splash" id="bootSplash">
      <div class="boot-logo">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/>
          <path d="M7 8h6M7 11h10M7 14h7"/>
          <circle cx="17.5" cy="17.5" r="3"/>
          <path d="M19.8 19.8 22 22"/>
        </svg>
      </div>
      <p class="boot-name">CardVault</p>
      <p class="boot-sub">Your pocket business-card wallet</p>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <!-- Third-party libraries (free CDNs, no API keys, no build step).
       The app degrades gracefully if these fail to load (e.g. offline). -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
